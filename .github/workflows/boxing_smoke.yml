name: boxing-slate-smoke
# One-off live smoke for the Boxing odds-api events path (swarm handoff). Delete after green.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: live smoke - Boxing events endpoint (free, no odds credits)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python3 scripts/league_slate.py Boxing --date 20260928
