name: card-chain-preview
# Preview-only card chain (owner green light 9/27 via main): candidate artifacts, no pushes.
on:
  workflow_dispatch:
permissions:
  contents: none
concurrency:
  group: card-chain-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: shim analysis-tree paths + key file
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          pip install -q cryptography
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/rix_tmp"
          sudo mkdir -p /home/sandbox
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/sandbox/rix_tmp
          echo "$THE_ODDS_API_KEY" | sudo tee /home/sandbox/.odds_api_key > /dev/null
          sudo chmod 600 /home/sandbox/.odds_api_key
          mkdir -p "$GITHUB_WORKSPACE/data"
      - name: run card chain (candidate artifacts only)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          POLYMARKET_API_KEY_ID: ${{ secrets.POLYMARKET_API_KEY_ID }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
        run: bash scripts/card_chain_preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-preview-2026-09-28
          if-no-files-found: warn
          path: |
            /tmp/card_chain.log
            /tmp/manifest_preview_2026-09-28.json
            /tmp/card_preview_2026-09-28.html
            /tmp/candidates_2026-09-28.json
            /tmp/tennis_catch_2026-09-28.json
            /tmp/slate_day_2026-09-28.json
            /tmp/hunt_v2_2026-09-28.json
            /tmp/cand_st_2026-09-28.json
            /tmp/cand_props_2026-09-28.json
            /tmp/props_candidates.json
