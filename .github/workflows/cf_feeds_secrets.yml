name: cf-feeds-secrets
# Repo-retirement steps 1-3 (2026-10-14): maps the repo secrets each ported lane needs onto the
# rixpicks-feeds worker as WORKER SECRETS via `wrangler secret put`. Values are piped straight
# from the repo secret into wrangler - this workflow never prints them (same discipline as
# cf_ultrix_secrets.yml). Scope: secret puts ONLY - no deploys, no new resources.
# Secrets per lane:
#   THE_ODDS_API_KEY   -> odds, nfl-scores, extras lanes (the PAID key; core/budget.py PAID_TIER,
#                         20K/mo plan - there is no free-tier fallback path in the worker)
#   KALSHI_KEY_ID      -> futures + kalshi-quotes + futures-quotes lanes (authed REST)
#   KALSHI_PRIVATE_KEY -> same (RSA-PSS signing key, PEM)
#   YT_API_KEY         -> official-video lane (optional authoritative embeddable check)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-feeds-deploy
  cancel-in-progress: false
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install wrangler
        working-directory: workers/rixpicks-feeds
        run: npm install wrangler@4 --no-save --silent
      - name: put THE_ODDS_API_KEY on rixpicks-feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.THE_ODDS_API_KEY }}
        working-directory: workers/rixpicks-feeds
        run: |
          if [ -z "$SECRET_VALUE" ]; then echo "THE_ODDS_API_KEY repo secret not set - skipping"; exit 0; fi
          printf '%s' "$SECRET_VALUE" | ./node_modules/.bin/wrangler secret put THE_ODDS_API_KEY
          echo "THE_ODDS_API_KEY set on rixpicks-feeds"
      - name: put KALSHI_KEY_ID on rixpicks-feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.KALSHI_KEY_ID }}
        working-directory: workers/rixpicks-feeds
        run: |
          if [ -z "$SECRET_VALUE" ]; then echo "KALSHI_KEY_ID repo secret not set - skipping"; exit 0; fi
          printf '%s' "$SECRET_VALUE" | ./node_modules/.bin/wrangler secret put KALSHI_KEY_ID
          echo "KALSHI_KEY_ID set on rixpicks-feeds"
      - name: put KALSHI_PRIVATE_KEY on rixpicks-feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.KALSHI_PRIVATE_KEY }}
        working-directory: workers/rixpicks-feeds
        run: |
          if [ -z "$SECRET_VALUE" ]; then echo "KALSHI_PRIVATE_KEY repo secret not set - skipping"; exit 0; fi
          printf '%s' "$SECRET_VALUE" | ./node_modules/.bin/wrangler secret put KALSHI_PRIVATE_KEY
          echo "KALSHI_PRIVATE_KEY set on rixpicks-feeds"
      - name: put YT_API_KEY on rixpicks-feeds (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.YT_API_KEY }}
        working-directory: workers/rixpicks-feeds
        run: |
          if [ -z "$SECRET_VALUE" ]; then echo "YT_API_KEY repo secret not set - skipping"; exit 0; fi
          printf '%s' "$SECRET_VALUE" | ./node_modules/.bin/wrangler secret put YT_API_KEY
          echo "YT_API_KEY set on rixpicks-feeds"
      - name: list worker secret NAMES (values never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/rixpicks-feeds
        run: ./node_modules/.bin/wrangler secret list
