name: cf-pages-deploy
# CF migration (main Sep 27 2:05): mirror every main-branch push to Cloudflare Pages project
# "rix-picks" in PARALLEL with repo-Pages. GH Pages keeps serving rix-picks.com until the flip -
# this workflow never touches DNS and never blocks the repo-Pages path. Failure here fails only
# itself (watcher surfaces it); the site stays live on GH Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate ticket data before mirror upload
        run: python3 scripts/validate_ticket_data.py
      - name: deploy to Cloudflare Pages (rix-picks)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=rix-picks --branch=main --commit-dirty=true
      - name: verify pages.dev mirror
        timeout-minutes: 6
        run: |
          for i in $(seq 1 18); do
            if python3 scripts/verify_pages_mirror.py https://rix-picks.pages.dev; then exit 0; fi
            echo "Attempt $i: waiting for the checked release to reach the mirror"
            sleep 10
          done
          echo "CF MIRROR VERIFY FAILED"; exit 1
