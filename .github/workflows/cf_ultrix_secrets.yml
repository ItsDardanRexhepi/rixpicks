name: cf-ultrix-secrets
# Builder 9/28: maps repo secrets onto the deployed UltRix workers. Values arrive as repo secrets
# sealed-boxed by their producers (analysis env); this workflow never prints them. Scope: secret
# puts ONLY - no new resources, no provisioning expansion.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-ultrix-deploy
  cancel-in-progress: false
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: fetch ultrix package (configs only, ephemeral)
        env:
          ULTRIX_PAT: ${{ secrets.ULTRIX_READ_PAT }}
        run: |
          set -e
          SHA=$(curl -sf -H "Authorization: token $ULTRIX_PAT" https://api.github.com/repos/ItsDardanRexhepi/ultrix/commits/main | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "CONFIGS FROM ULTRIX SHA: $SHA"
          curl -sfL -H "Authorization: token $ULTRIX_PAT" "https://api.github.com/repos/ItsDardanRexhepi/ultrix/tarball/$SHA" -o u.tar.gz
          mkdir -p pkg && tar xzf u.tar.gz -C pkg --strip-components=1 --wildcards '*/cloudflare'
      - name: resolve KV IDs and fill toml placeholders
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          KV=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "$API/storage/kv/namespaces?per_page=100")
          KBID=$(echo "$KV" | jq -r '.result[]? | select(.title=="rixpicks-kb") | .id')
          LOOPID=$(echo "$KV" | jq -r '.result[]? | select(.title=="rixpicks-loop-state") | .id')
          [ -n "$KBID" ] && [ -n "$LOOPID" ] || { echo "KV ID RESOLVE FAIL"; exit 1; }
          for T in pkg/cloudflare/wrangler.toml pkg/cloudflare/wrangler.intake.toml; do
            sed -i "s/^id = \"rixpicks-kb\"$/id = \"$KBID\"/" "$T"
            sed -i "s/^id = \"rixpicks-loop-state\"$/id = \"$LOOPID\"/" "$T"
          done
      - name: install wrangler
        working-directory: pkg/cloudflare
        run: npm install wrangler@4 --no-save --silent
      - name: put INGEST_SECRET on ultrix-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.ULTRIX_INGEST_SECRET }}
        working-directory: pkg/cloudflare
        run: |
          if [ -z "$SECRET_VALUE" ]; then echo "ULTRIX_INGEST_SECRET repo secret not set - skipping"; exit 0; fi
          printf '%s' "$SECRET_VALUE" | ./node_modules/.bin/wrangler secret put INGEST_SECRET --config wrangler.toml
          echo "INGEST_SECRET set on ultrix-core"
      - name: put NVIDIA_API_KEY on ultrix-intake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.NVIDIA_API_KEY }}
        working-directory: pkg/cloudflare
        run: |
          if [ -z "$SECRET_VALUE" ]; then echo "NVIDIA_API_KEY repo secret not set - skipping"; exit 0; fi
          printf '%s' "$SECRET_VALUE" | ./node_modules/.bin/wrangler secret put NVIDIA_API_KEY --config wrangler.intake.toml
          echo "NVIDIA_API_KEY set on ultrix-intake"
      - name: confirm still fail-closed unauthenticated
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SUB=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://ultrix-core.$SUB.workers.dev/facts")
          echo "unauthenticated GET /facts -> $CODE"
          [ "$CODE" = "403" ] || { echo "FAIL-CLOSED CHECK FAILED"; exit 1; }
          echo "still fail-closed without the key (expected)"
