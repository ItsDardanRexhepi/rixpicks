name: cf-ultrix-tail
# Builder 9/28: one-shot diagnostic. Tails ultrix-intake for ~100s so a coordinated test
# POST /ingest (fired by analysis during the window) shows the consumer outcome live.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - name: install wrangler
        run: |
          mkdir -p tailenv && cd tailenv && npm install wrangler@4 --no-save --silent
      - name: worker settings - bound KV namespace ids
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          for SC in ultrix-core ultrix-intake; do
            echo "== $SC bindings"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "$API/workers/scripts/$SC/settings" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("result",{}); print(json.dumps([{"name":b.get("name"),"type":b.get("type"),"namespace_id":b.get("namespace_id"),"bucket_name":b.get("bucket_name"),"queue_name":b.get("queue_name")} for b in d.get("bindings",[])], indent=1))'
          done
      - name: facts write evidence - KV keys + R2 learned archives
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: tailenv
        run: |
          set -e
          echo "== KV facts: keys (remote)"
          ./node_modules/.bin/wrangler kv key list --namespace-id 603c5fdbe64a4b32be25ed39a67dd3f9 --prefix facts: --remote || echo "KV LIST FAILED"
          echo "== R2 learned/ objects (remote API)"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/ultrix-archive/objects?prefix=learned/&per_page=10" | head -c 500
          echo
      - name: tail ultrix-intake (100s window)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: tailenv
        run: timeout 100 ./node_modules/.bin/wrangler tail ultrix-intake --format json || true
