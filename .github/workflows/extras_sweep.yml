name: extras-sweep
on:
  schedule:
    # 2x/day MLS/MMA/boxing pulls: 11:30 + 17:30 PT = 18:30 + 00:30 UTC (PDT).
    # 3 credits/run, 6/day, inside the shared 16-call/day free-tier discipline.
    - cron: '30 18,0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-main-writers
  cancel-in-progress: false
jobs:
  hold-check:
    # posting-job auto-hold: structural FAIL only (Julian 9/30). Fails open on unknown/error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hc.outputs.held }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/health_gate.js
            .github/actions
          sparse-checkout-cone-mode: false
      - id: hc
        uses: ./.github/actions/hold-check
  extras:
    needs: hold-check
    if: ${{ !cancelled() && needs.hold-check.outputs.held != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate workflow YAML
        run: |
          pip install -q pyyaml
          python3 scripts/check_workflows.py
      - name: pull extras books and commit
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          bash scripts/extras_pull.sh
          git config user.name 'extras-sweep'; git config user.email 'actions@users.noreply.github.com'
          git add extras_books.json
          git commit -m "extras: book sweep $(date -u '+%Y-%m-%d %H:%M UTC')" || echo 'no changes'
          # K22 (Sep 30, run 36730127672): hardened push guard - resets HEAD on loud-fail
          # (the on-failure hook pushes HEAD) and fails loud when upstream moved a
          # lane-shipped file mid-run; -X theirs alone silently discarded lane pushes.
          bash scripts/push_with_guard.sh
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo 'PUSH READBACK FAILED: origin/main != HEAD' >&2; exit 1; }
      - name: on-failure instant marker
        if: failure()
        run: |
          mkdir -p incidents
          printf '# FAILURE extras-sweep in-run %s\nsha: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "incidents/${GITHUB_RUN_ID}-inrun.md"
          git config user.name 'incident-hook'; git config user.email 'actions@users.noreply.github.com'
          # K22 (Sep 30, run 36730127672): this hook pushes HEAD - reset first so a mid-run
          # generated/merged worktree never ships.
          git fetch origin main && git reset --hard origin/main
          git add incidents/ && git commit -m "incident: extras-sweep in-run failure $GITHUB_RUN_ID" && git push || true
