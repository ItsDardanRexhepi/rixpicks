name: futures-ws-listener
# Persistent futures outright-board WS listener (builder spec v2 2026-09-28).
# Runs a 340-min window then re-dispatches itself; the */30 cron is a watchdog that
# no-ops while any run is active, so a dead feed revives within 30 min even if the
# self-dispatch chain breaks. Builder wake is the final backstop.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

# Auditor 9:41 HIGH: two listeners ran concurrently - dispatched runs bypassed the
# schedule-only alive-guard. The group is a hard mutex (at most one active run of
# this workflow, ever); the guard below is now event-agnostic so queued/scheduled/
# dispatched/respawned runs all no-op when another listener is alive. Queue (not
# cancel): a long-lived window must never be killed mid-tick by the watchdog.
concurrency:
  group: futures-ws-listener
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      alive: ${{ steps.check.outputs.alive }}
    steps:
      - name: Check for an active listener run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # event-agnostic (auditor 9:41): count OTHER in_progress runs, any trigger -
          # the old schedule-only check let every workflow_dispatch stack a duplicate.
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/futures_ws.yml/runs?status=in_progress" --jq '.workflow_runs | map(select(.id != ${{ github.run_id }})) | length')
          echo "other_in_progress=$n (self ${{ github.run_id }} excluded)"
          if [ "$n" -ge 1 ]; then echo "alive=1" >> "$GITHUB_OUTPUT"; else echo "alive=0" >> "$GITHUB_OUTPUT"; fi
  listen:
    needs: guard
    if: needs.guard.outputs.alive == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # ref: main - a run that waited in the concurrency group (the */30 backstop queues behind a
      # live window) must listen from the CURRENT tip. Its queued-at sha is hours stale and every
      # tick push fails its rebase on the previous window's ticks: run 36841505656 (queued 09:15Z
      # on 35b3a5a9, started 11:35Z) failed all 238 pushes, no ticks 11:35Z-17:17Z on Oct 1.
      # Fixture: scripts/test_futures_ws_checkout.py.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets cryptography
      - name: Run WS listener window
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          LISTENER_MAX_MINUTES: '340'
          # 240 s (was 75): a tick commit every 75 s kept cancelling every Pages deploy (10 straight cancelled
          # builds Oct 5 12:25-12:35 PT). Ticks still land well inside the 20 min staleness gate.
          LISTENER_PUSH_EVERY: '240'
        run: |
          git config user.name "rix-bot"
          git config user.email "bot@rix-picks.com"
          python3 scripts/futures_ws_listener.py
      - name: Respawn next window
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/futures_ws.yml/dispatches" -f ref=main || true
