name: kalshi-quotes
on:
  schedule:
    # every 5 min, 8 AM - 11 PM PT = 15:00-06:00 UTC (PDT) - Kalshi reads are
    # unauthenticated and uncapped, unlike The Odds API. The wake dispatcher
    # also fires workflow_dispatch when the last run is >5 min stale.
    - cron: '*/5 15-23,0-6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-main-writers
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate workflow YAML
        run: |
          pip install -q pyyaml
          python3 scripts/check_workflows.py
      - name: fetch + write kalshi quotes
        run: python3 scripts/kalshi_quotes.py
      - name: commit if changed
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/nfl_kalshi_quotes.json
          if git diff --cached --quiet; then echo "no change - no commit"; exit 0; fi
          git commit -m "kalshi quotes $(date '+%H:%M PT')"
          for i in 1 2; do
            if git push; then break; fi
          git pull --rebase -X theirs || { git rebase --abort; continue; }
            OF=$(git show --pretty='' --name-only ORIG_HEAD)
            git diff --quiet ORIG_HEAD HEAD -- $OF || { echo 'REBASE GUARD: rebase altered generated content - failing loud; next cycle regenerates' >&2; exit 1; }
          done
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo 'PUSH READBACK FAILED: origin/main != HEAD' >&2; exit 1; }
