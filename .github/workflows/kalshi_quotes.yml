name: kalshi-quotes
on:
  schedule:
    # every 5 min, 8 AM - 11 PM PT = 15:00-06:00 UTC (PDT) - Kalshi reads are
    # unauthenticated and uncapped, unlike The Odds API. The wake dispatcher
    # also fires workflow_dispatch when the last run is >5 min stale.
    - cron: '*/5 15-23,0-6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kalshi-quotes
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch + write kalshi quotes
        run: python3 scripts/kalshi_quotes.py
      - name: commit if changed
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/nfl_kalshi_quotes.json
          if git diff --cached --quiet; then echo "no change - no commit"; exit 0; fi
          git commit -m "kalshi quotes $(date '+%H:%M PT')"
          for i in 1 2; do git push && break || git pull --rebase; done
