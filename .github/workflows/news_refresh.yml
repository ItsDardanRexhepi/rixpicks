name: news-refresh
# Lane 3 Option A (main 9/30 4:04 PM PT): DISABLED. News is produced by the rixpicks-feeds
# worker and bridged into slates/news.json by x-feed (scripts/bridge_worker_news.py).
# Re-arm = restore the repository_dispatch + schedule triggers below (one revert commit):
#   repository_dispatch: types: [external-tick]
#   schedule: cron '*/2 13-23,0-6 * * *'
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: news-refresh
  cancel-in-progress: false
jobs:
  hold-check:
    # posting-job auto-hold: structural FAIL only (Julian 9/30). Fails open on unknown/error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hc.outputs.held }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/health_gate.js
            .github/actions
          sparse-checkout-cone-mode: false
      - id: hc
        uses: ./.github/actions/hold-check
  news:
    needs: hold-check
    if: ${{ !cancelled() && needs.hold-check.outputs.held != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "fetch + write multi-source news feed"
        run: python3 scripts/news_feed.py
      - name: "commit if changed"
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/
          if git diff --cached --quiet; then echo "no change - no commit"; exit 0; fi
          git commit -m "news feed $(date '+%H:%M PT')"
          # push-race hardening (2:25 red-run kill): futures_ws listener lands commits every 75s,
          # so races are structural. autostash covers residual local edits (unstaged writes were
          # blocking the rebase); 5 tries with backoff.
          # bash -e/conflict class kill (guard 4 sweep 10:43, same as x-feed): every fallible
          # command if-guarded, theirs-wins on generated slates, LOUD exit after 5 tries -
          # the old loop exited GREEN with the commit dropped (silent data loss shape).
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q; then
              if git push -q; then ok=1; break; fi
            else
              if git status --porcelain | grep -q '^UU slates/'; then
                git checkout --theirs -- slates/ || true
                git add slates/ || true
                if GIT_EDITOR=true git rebase --continue; then
                  if git push -q; then ok=1; break; fi
                fi
              fi
              git rebase --abort 2>/dev/null || true
            fi
            sleep 3
          done
          [ "$ok" = "1" ] || exit 1
      - name: "kalshi-quotes staleness watchdog"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/368490964/runs?per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs',[]); print((r[0]['created_at']+' '+r[0]['status']) if r else '1970-01-01T00:00:00Z none')")
          ts=$(echo "$last" | cut -d' ' -f1); st=$(echo "$last" | cut -d' ' -f2)
          age=$(( $(date +%s) - $(date -d "$ts" +%s) ))
          echo "newest kalshi-quotes run: $ts status=$st age=${age}s"
          if [ "$st" = "queued" ] || [ "$st" = "in_progress" ]; then
            echo "run active - no dispatch"
          elif [ "$age" -gt 600 ]; then
            echo "stale >10min - dispatching kalshi-quotes"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/368490964/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "fresh - no dispatch"
          fi
