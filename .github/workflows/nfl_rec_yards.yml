name: nfl-rec-yards
# Refreshes slates/nfl_rec_yards.json (NFL futures receiving-yards counters, ESPN byathlete GET).
# Wired Oct 2 after the sidecar went stale at 48 h and the health gate held all publishes
# (served: nfl_rec_yards.json numeric + fresh). Season totals move once a week, so every 6 h
# keeps the file far inside the 48 h gate even if GitHub cron starves this repo.
# Fail-closed: scripts/nfl_rec_yards.py refuses to write when no players parse, and a player
# missing from ESPN is omitted (card renders Unavailable), never zero-filled.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-rec-yards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch + write rec-yards sidecar
        run: python3 scripts/nfl_rec_yards.py
      - name: commit if changed
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/nfl_rec_yards.json
          if git diff --cached --quiet; then echo "no change - no commit"; exit 0; fi
          git commit -m "nfl rec-yards sidecar $(date '+%m-%d %H:%M PT')"
          bash scripts/push_with_guard.sh
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo 'PUSH READBACK FAILED: origin/main != HEAD' >&2; exit 1; }
