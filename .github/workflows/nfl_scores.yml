name: nfl-scores-confirm
on:
  schedule:
    # NFL live windows (PT): Sun 10a-8:30p = 17:00-03:30 UTC; Thu/Mon nights covered by
    # the self-gate (script exits free when nothing is live). 15-min cadence per approval.
    - cron: '*/15 17-23 * * *'
    - cron: '*/15 0-4 * * *'
  workflow_dispatch:
    inputs:
      hold_bypass:
        description: 'REPAIR ONLY: set to the word repair to override a posting hold (logged loudly with actor)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: site-main-writers
  cancel-in-progress: false
jobs:
  hold-check:
    # posting-job auto-hold: structural FAIL only (Julian 9/30). Fails open on unknown/error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hc.outputs.held }}
    steps:
      - uses: actions/checkout@v4
      - id: hc
        uses: ./.github/actions/hold-check
  scores:
    needs: hold-check
    if: ${{ !cancelled() && needs.hold-check.result == 'success' && needs.hold-check.outputs.held == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate workflow YAML
        run: |
          pip install -q pyyaml
          python3 scripts/check_workflows.py
      - name: confirm NFL scores (self-gated)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          bash scripts/nfl_scores_confirm.sh
          git config user.name 'nfl-scores'; git config user.email 'actions@users.noreply.github.com'
          git add nfl_scores.json
          git commit -m "nfl scores confirm $(date -u '+%H:%M UTC')" || echo 'no changes'
          # K22 (Sep 30, run 36730127672): hardened push guard - resets HEAD on loud-fail
          # (the on-failure hook pushes HEAD) and fails loud when upstream moved a
          # lane-shipped file mid-run; -X theirs alone silently discarded lane pushes.
          # The guard also reads the push back (origin/main must contain HEAD); a run with
          # nothing to commit has nothing to read back (Oct 2 runs 36962855292 + 36962967323).
          bash scripts/push_with_guard.sh
      - name: on-failure instant marker
        if: failure()
        run: |
          mkdir -p incidents
          printf '# FAILURE nfl-scores-confirm in-run %s\nsha: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "incidents/${GITHUB_RUN_ID}-inrun.md"
          git config user.name 'incident-hook'; git config user.email 'actions@users.noreply.github.com'
          # K22 (Sep 30, run 36730127672): this hook pushes HEAD - reset first so a mid-run
          # generated/merged worktree never ships.
          git fetch origin main && git reset --hard origin/main
          git add incidents/ && git commit -m "incident: nfl-scores-confirm in-run failure $GITHUB_RUN_ID" && git push || true
