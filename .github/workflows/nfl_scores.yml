name: nfl-scores-confirm
on:
  schedule:
    # NFL live windows (PT): Sun 10a-8:30p = 17:00-03:30 UTC; Thu/Mon nights covered by
    # the self-gate (script exits free when nothing is live). 15-min cadence per approval.
    - cron: '*/15 17-23 * * *'
    - cron: '*/15 0-4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-main-writers
  cancel-in-progress: false
jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate workflow YAML
        run: |
          pip install -q pyyaml
          python3 scripts/check_workflows.py
      - name: confirm NFL scores (self-gated)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          bash scripts/nfl_scores_confirm.sh
          git config user.name 'nfl-scores'; git config user.email 'actions@users.noreply.github.com'
          git add nfl_scores.json
          git commit -m "nfl scores confirm $(date -u '+%H:%M UTC')" || echo 'no changes'
          for i in 1 2; do
            if git push; then break; fi
            git pull --rebase -X theirs || { git rebase --abort; continue; }
            OF=$(git show --pretty='' --name-only ORIG_HEAD)
            git diff --quiet ORIG_HEAD HEAD -- $OF || { echo 'REBASE GUARD: rebase altered generated content - failing loud' >&2; exit 1; }
          done
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo 'PUSH READBACK FAILED: origin/main != HEAD' >&2; exit 1; }
      - name: on-failure instant marker
        if: failure()
        run: |
          mkdir -p incidents
          printf '# FAILURE nfl-scores-confirm in-run %s\nsha: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "incidents/${GITHUB_RUN_ID}-inrun.md"
          git config user.name 'incident-hook'; git config user.email 'actions@users.noreply.github.com'
          git add incidents/ && git commit -m "incident: nfl-scores-confirm in-run failure $GITHUB_RUN_ID" && git push || true
