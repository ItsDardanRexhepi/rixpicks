name: odds-refresh
on:
  schedule:
    # every 15 min, 8 AM - 11 PM PT = 15:00-06:00 UTC (PDT).
    # scripts/refresh.sh gates on game proximity (live or starting within 2h)
    # and a 16-odds-API-call/day cap, so a wide window is free-tier-safe.
    - cron: '*/15 15-23,0-6 * * *'
  workflow_dispatch:
permissions:
  contents: write
# Chaos drill #3 (Sep 26): overlapping runs raced the API counter and git push.
concurrency:
  group: odds-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: refresh odds and rebuild
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: bash scripts/refresh.sh
