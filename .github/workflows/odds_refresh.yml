name: odds-refresh
on:
  schedule:
    # every 15 min, 8 AM - 11 PM PT = 15:00-06:00 UTC (PDT).
    # scripts/refresh.sh gates on game proximity (live or starting within 2h).
    # Standing rule 9/27: no daily cap; only tripwire is the plan's 20K credits/mo hard limit, fail-loud.
    - cron: '*/15 15-23,0-6 * * *'
  workflow_dispatch:
    inputs:
      hold_bypass:
        description: 'REPAIR ONLY: set to the word repair to override a posting hold (logged loudly with actor)'
        type: string
        default: ''
  # guard 4 starvation class (9/28 7:40 slip: hosted cron 56 min late): the CF dispatcher's
  # external-tick is the reliable 15-min time base; hosted cron stays as backstop signal only.
  repository_dispatch:
    types: [external-tick]
permissions:
  contents: write
# Chaos drill #3 (Sep 26): overlapping runs raced the API counter and git push.
concurrency:
  group: odds-refresh
  cancel-in-progress: false
jobs:
  hold-check:
    # posting-job auto-hold: structural FAIL only (9/30). Fails open on unknown/error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hc.outputs.held }}
    steps:
      - uses: actions/checkout@v4
      - id: hc
        uses: ./.github/actions/hold-check
  # The provider's last credit reading (refresh.sh's hard-cap tripwire, the watchdog's quota floor)
  # is ops state, never site content: every file in the checkout is served, so it lives in
  # ~/.rixpicks-ops and travels between runs in the Actions cache (LS-22). Any job on main can write
  # an odds-quota-* entry and a cache archive can overwrite workspace files before they run, so the
  # archive is unpacked only here: no secrets, no token permissions, no checkout. Only a validated
  # integer reading, its PT month and its PT date leave this job; the refresh job, which holds the
  # odds and Polymarket secrets, never unpacks a cache. scripts/test_quota_state_jobs.py checks this.
  quota-state:
    needs: hold-check
    if: ${{ !cancelled() && needs.hold-check.result == 'success' && needs.hold-check.outputs.held == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      remaining: ${{ steps.read.outputs.remaining }}
      month: ${{ steps.read.outputs.month }}
      pt_date: ${{ steps.read.outputs.pt_date }}
    steps:
      - name: "restore odds quota state"
        uses: actions/cache/restore@v4
        with:
          path: ~/.rixpicks-ops
          key: odds-quota-${{ github.run_id }}
          restore-keys: odds-quota-
      - name: "validate the reading (integer count, PT month, PT date; anything else gives none)"
        id: read
        run: |
          /usr/bin/python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re, stat
          rem = month = day = ''
          try:
              q = os.path.expanduser('~/.rixpicks-ops/odds_quota.json')
              if stat.S_ISREG(os.lstat(q).st_mode):
                  with open(q, 'rb') as f:
                      d = json.loads(f.read(4096).decode('utf-8'))
                  r, p = d.get('last_remaining'), d.get('pt_date')
                  m = d.get('month', p[:7] if isinstance(p, str) else None)
                  if (type(r) is int and 0 <= r <= 999999999
                          and isinstance(m, str) and re.fullmatch(r'20[0-9]{2}-(0[1-9]|1[0-2])', m)
                          and (p is None or (isinstance(p, str) and p[:7] == m
                                             and re.fullmatch(r'20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])', p)))):
                      rem, month, day = str(r), m, p or ''
          except Exception:
              pass
          print('remaining=' + rem)
          print('month=' + month)
          print('pt_date=' + day)
          PY
  refresh:
    needs: [hold-check, quota-state]
    if: ${{ !cancelled() && needs.hold-check.result == 'success' && needs.hold-check.outputs.held == 'false' }}
    runs-on: ubuntu-latest
    steps:
      # ref: main - a run that waited in the concurrency group checks out the SHA that queued it,
      # which predates the previous run's push. That stale base made push_with_guard.sh see
      # manifest.json move upstream and fail loud (run 37225011789, Oct 4). Check out the tip
      # of main instead (same fix as futures_ws.yml). The guard still protects mid-run races.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The quota-state job's outputs come in through env only and are validated again before they
      # seed the ops state. No reading (cache miss, malformed) seeds nothing, and refresh.sh then
      # takes the free GET /v4/sports reading before any paid pull. The tripwire clears by itself in
      # a new PT month; to clear it mid-month, delete the odds-quota-* cache entries
      # (gh cache list --key odds-quota-, gh cache delete <id>) - see scripts/refresh.sh.
      - name: "seed the validated quota reading (no cache is unpacked in this job)"
        env:
          QUOTA_REMAINING: ${{ needs.quota-state.outputs.remaining }}
          QUOTA_MONTH: ${{ needs.quota-state.outputs.month }}
          QUOTA_PT_DATE: ${{ needs.quota-state.outputs.pt_date }}
        run: |
          mkdir -p ~/.rixpicks-ops
          python3 scripts/ops_quota.py seed ~/.rixpicks-ops/odds_quota.json
          touch ~/.rixpicks-ops/.restored
      - name: refresh odds and rebuild
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          POLYMARKET_API_KEY_ID: ${{ secrets.POLYMARKET_API_KEY_ID }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
        run: |
          pip install -q cryptography
          bash scripts/refresh.sh
      - name: new quota reading this run
        id: quota
        if: ${{ !cancelled() }}
        run: |
          if [ ~/.rixpicks-ops/odds_quota.json -nt ~/.rixpicks-ops/.restored ]; then echo "fresh=true" >> "$GITHUB_OUTPUT"; else echo "fresh=false" >> "$GITHUB_OUTPUT"; fi
      - name: save odds quota state
        if: ${{ !cancelled() && steps.quota.outputs.fresh == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.rixpicks-ops
          key: odds-quota-${{ github.run_id }}-${{ github.run_attempt }}
      - name: on-failure instant marker
        if: failure()
        run: |
          mkdir -p incidents
          printf '# FAILURE odds-refresh in-run %s\nsha: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "incidents/${GITHUB_RUN_ID}-inrun.md"
          git config user.name 'incident-hook'; git config user.email 'actions@users.noreply.github.com'
          # K22 (Sep 30, run 36730127672): this hook pushes HEAD - reset first so a mid-run
          # generated/merged worktree (e.g. a rebase-race Frankenstein manifest) never ships.
          git fetch origin main && git reset --hard origin/main
          git add incidents/ && git commit -m "incident: odds-refresh in-run failure $GITHUB_RUN_ID" && git push || true
