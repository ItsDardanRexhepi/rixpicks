name: pages-gated-deploy
# Gated deployment. Deploys the gate-verified tip to GitHub Pages ONLY when
# the Pages source is "GitHub Actions" AND the marker file .github/PAGES_ACTIVE exists.
# Without the marker the deploy job is skipped, so this file is inert on a branch-served site.
#
# Flow: gate (health gate on the exact tip, pins that sha; DEPLOY_LOCK honored; change-detect vs the
# last SUCCESSFUL github-pages deployment) -> package (artifact of THAT sha) -> deploy.
# Futures ticks are committed [skip ci] and by GITHUB_TOKEN (no push event), so the 5-min schedule
# is what carries them to the site once active; push covers PAT/manual commits.
# FAIL or lock = no deploy; the last good version keeps serving.
on:
  push:
    branches: [main]
  schedule:
    # carries the [skip ci] / GITHUB_TOKEN bot commits (futures ticks), which fire no push event.
    # Best effort on GitHub's side; the change-detect step makes an idle tick a no-op deploy-wise.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'treat the tip as changed (test run; still needs marker file to actually deploy)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-gated-deploy
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      ok: ${{ steps.g.outputs.ok }}
      locked: ${{ steps.g.outputs.locked }}
      active: ${{ steps.g.outputs.active }}
      sha: ${{ steps.g.outputs.sha }}
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        shell: bash
        run: |
          ok=false; locked=false; active=false
          [ -e DEPLOY_LOCK ] && locked=true
          [ -e .github/PAGES_ACTIVE ] && active=true
          set +e; node scripts/health_gate.js > /tmp/gate.log 2>&1; rc=$?; set -e
          cat /tmp/gate.log
          [ "$rc" = "0" ] && ok=true
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "locked=$locked" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          { echo "## gate ok=$ok locked=$locked marker=$active sha=$(git rev-parse --short HEAD)"; grep '^FAIL' /tmp/gate.log | sed 's/^/- /' || true; } >> "$GITHUB_STEP_SUMMARY"
      - id: c
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TIP: ${{ steps.g.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 scripts/pages_changed.py | tee /tmp/changed.log
          { echo "- change-detect: $(cat /tmp/changed.log)"; } >> "$GITHUB_STEP_SUMMARY"
  gate-bites:
    # self-test: a deliberately broken copy of the tree MUST fail the same gate (proves it bites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 scripts/test_validate_ticket_data.py
          bash scripts/test_push_ticket_guard.sh
          rm -rf /tmp/broken && mkdir /tmp/broken && cp -r . /tmp/broken/ && cd /tmp/broken
          python3 - <<'PY'
          p='slates/wooder_tickets.json'; s=open(p).read(); open(p,'w').write(s[:1000])
          PY
          if node scripts/health_gate.js > /tmp/g2.log 2>&1; then echo "GATE DID NOT BITE"; exit 1; else echo "gate bit as expected"; grep '^FAIL' /tmp/g2.log | head -3; fi
  package:
    needs: [gate, gate-bites]
    if: ${{ needs.gate.outputs.ok == 'true' && needs.gate.outputs.locked != 'true' && needs.gate.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # the exact tree the gate checked, not whatever main moved to since
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: [gate, package]
    if: ${{ needs.package.result == 'success' && needs.gate.outputs.active == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
