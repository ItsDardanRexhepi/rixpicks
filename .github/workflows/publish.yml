name: publish-card
# Chaos drill #7 (Sep 26): publish must not depend on an interactive push (PAT/sudo/web editor).
# Two-dispatch flow: dispatch with approve=false -> candidate artifact for the swarm;
# swarm passes -> dispatch with approve=true -> the runner itself commits and pushes.
on:
  workflow_dispatch:
    inputs:
      approve:
        description: 'push the built card live (true/false)'
        required: true
        default: 'false'
permissions:
  contents: write
concurrency:
  group: publish-card
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: snapshot rollback artifact (pre-build live pages)
        run: |
          mkdir -p /tmp/rollback
          cp index.html game-*.html futures.html team-*.html /tmp/rollback/ 2>/dev/null || true
      - name: build card
        env:
          # data auditor (Sep 26): inputs.approve is the STRING true/false; the builder gates on =='1'
          RP_PUBLISH: ${{ inputs.approve == 'true' && '1' || '0' }}
        run: |
          # fail-closed: a builder non-zero exit (e.g. unresolved-market exit 3) must fail this
          # step outright - never tee-mask into a push of partially generated files
          set -o pipefail
          python3 scripts/build_gh_page.py manifest.json index.html 2>&1 | tee /tmp/build.log
      - name: upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-card
          path: |
            index.html
            game-*.html
            futures.html
            team-*.html
            /tmp/build.log
      - name: upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-card
          path: /tmp/rollback/
      - name: push when approved
        if: ${{ inputs.approve == 'true' }}
        run: |
          git config user.name 'rixpicks-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          # fail-closed: empty diff is the only soft commit case; a real commit error is fatal
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m "card publish $(date -u +%Y-%m-%dT%H:%MZ)" || { echo 'COMMIT FAILED'; exit 1; }
          fi
          # fail-closed: both pushes failing (or a failed rebase) fails the run - never green without the card pushed
          PUSHED=0
          for i in 1 2; do
            if git push; then PUSHED=1; break; fi
            git pull --rebase || { echo 'REBASE FAILED'; exit 1; }
          done
          if [ "$PUSHED" != "1" ]; then echo 'PUSH FAILED after 2 attempts'; exit 1; fi
      - name: verify live deploy when approved
        if: ${{ inputs.approve == 'true' }}
        run: |
          BID=$(grep -oE 'build [0-9]+' /tmp/build.log | tail -1 | awk '{print $2}')
          echo "expecting build $BID live"
          # Sep 26: probe EACH host independently with -L (the CNAME cutover raced this step:
          # a redirect into a not-yet-resolving domain failed one shared curl and failed red on a good ship).
          # Either host serving the expected build ID = live.
          for i in $(seq 1 30); do
            for HOST in "https://itsdardanrexhepi.github.io/rixpicks/" "https://rix-picks.com/"; do
              LIVE=$(curl -fsSL "$HOST?cb=$RANDOM" 2>/dev/null || true)
              if [ -n "$LIVE" ] && echo "$LIVE" | grep -q "RP_BUILD='$BID'"; then echo "LIVE VERIFIED: build $BID via $HOST"; exit 0; fi
              echo "attempt $i: $HOST not serving build $BID yet"
            done
            sleep 10
          done
          echo "LIVE VERIFICATION FAILED: build $BID not served by either host after 5 minutes"; exit 1
