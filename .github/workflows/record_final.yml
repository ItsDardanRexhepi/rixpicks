name: record-final
# Record write on graded finals (main 9/27 decision): analysis drops ledger-verified grades in
# record_request.json (polled by the builder dispatcher / relayed dispatch on live finals);
# this workflow independently verifies each final against ESPN core, applies the ledger's exact
# numbers to manifest.json + history.json, rebuilds, syntax-sweeps emitted JS, and commits via
# GITHUB_TOKEN. No file token anywhere; secrets never move. Private kb/ledger stays analysis-side.
on:
  workflow_dispatch:
    inputs:
      hold_bypass:
        description: 'REPAIR ONLY: set to the word repair to override a posting hold (logged loudly with actor)'
        type: string
        default: ''
      force_rebuild:
        description: 'rebuild+ship site pages from current manifest even with no pending grades (true/false)'
        required: true
        default: 'false'
  # POST-stage retirement (main 9/27 3:03): the analysis side's queued write IS the trigger -
  # a push touching record_request.json fires the grade/apply/republish chain with zero manual
  # dispatch. Self-commit uses GITHUB_TOKEN, which never re-triggers (no recursion). The
  # site-main-writers concurrency group serializes against odds-refresh/publish races.
  push:
    branches: [main]
    paths: [record_request.json]
permissions:
  contents: write
concurrency:
  group: site-main-writers
  cancel-in-progress: false
jobs:
  hold-check:
    # posting-job auto-hold: structural FAIL only (9/30). Fails open on unknown/error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hc.outputs.held }}
    steps:
      - uses: actions/checkout@v4
      - id: hc
        uses: ./.github/actions/hold-check
  write:
    needs: hold-check
    if: ${{ !cancelled() && needs.hold-check.result == 'success' && needs.hold-check.outputs.held == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: apply graded finals (independent ESPN verify, fail-closed)
        run: python3 scripts/record_final.py
      - name: nothing pending check
        id: gate
        run: |
          # any apply-step write counts: an eod_day_close brief fill touches history.json only
          # (manifest unchanged) and must still rebuild the record pages and commit
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- manifest.json history.json record_request.json record_done.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: rebuild site + record pages
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -o pipefail
          # RP_REFRESH=1 (Sep 29 Leafs incident): record-final rebuilds are refresh-class - record/units
          # come from the just-graded manifest (canonical), and a post-entry market drift quarantines
          # instead of killing the record write. Entry ship gates stay with publish.yml.
          RP_REFRESH=1 python3 scripts/_build_nocanon_v2.py manifest.json index.html 2>&1 | tee /tmp/build.log
          python3 scripts/build_history.py history.json
      - name: syntax-sweep emitted script blocks
        if: steps.gate.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          s=open('index.html').read()
          blocks=[b for b in re.findall(r'<script>(.*?)</script>', s, re.S) if len(b)>50]
          bad=0
          for i,b in enumerate(blocks):
              open('/tmp/blk.js','w').write(b)
              r=subprocess.run(['node','--check','/tmp/blk.js'],capture_output=True,text=True)
              if r.returncode!=0:
                  bad+=1; print('BLOCK',i,'FAIL',r.stderr[:300])
          print('blocks',len(blocks),'bad',bad)
          sys.exit(1 if bad else 0)
          PY
      - name: commit record write
        if: steps.gate.outputs.changed == 'true'
        run: |
          git config user.name 'rixpicks-record-bot'
          git config user.email 'actions@users.noreply.github.com'
          # Full generated-output allowlist (9/29 run 36654629794): the rebuild fans out to
          # futures.html + every team-*.html page, not just index/game-* - an unstaged tracked
          # output makes pull --rebase REFUSE to start, and the abort then exits 128 (no rebase
          # in progress) under bash -e. Enumerated empirically by running the exact rebuild
          # (RP_REFRESH=1 _build_nocanon_v2.py + build_history.py) and listing modified files.
          # Apply-step writes: manifest/history/record_done/record_request + slates/api_record.json
          # (+ slates/wooder_combos.json when manifest carries a combo_expiry target).
          git add manifest.json history.json record.html yesterday.html index.html futures.html game-*.html team-*.html record_request.json record_done.json slates/api_record.json slates/wooder_combos.json
          git commit -m "Record write: graded finals applied from record_request.json (ESPN-verified, ledger-exact) [record-final]"
          # competing-writer fix (9/29 run 36652984676): futures-ticks pushes main ~every 75s OUTSIDE the
          # site-main-writers group, so a bare push after a minutes-long build rejects non-fast-forward.
          # Same retry/rebase/readback pattern as nfl_scores.yml: rebase onto the moved tip, fail loud if
          # the rebase alters the generated record files, and read back that our HEAD actually landed.
          # Tripwire: any tracked change outside the allowlist fails loud WITH NAMES here, instead of
          # surfacing as an anonymous rebase refusal mid-loop. Never blanket add -A.
          git diff --quiet || { echo 'UNSTAGED TRACKED OUTPUTS outside the add list - extend the allowlist:' >&2; git diff --name-only >&2; exit 1; }
          # K22 (Sep 30, run 36730127672): hardened push guard - resets HEAD on loud-fail
          # (the on-failure hook pushes HEAD) and fails loud when upstream moved a
          # lane-shipped file mid-run; -X theirs alone silently discarded lane pushes.
          bash scripts/push_with_guard.sh
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo 'PUSH READBACK FAILED: origin/main != HEAD' >&2; exit 1; }
