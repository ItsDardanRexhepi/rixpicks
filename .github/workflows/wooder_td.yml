name: wooder-td-tracker
on:
  schedule:
    # 5-min cadence across plausible NFL windows (9 AM - 11 PM PT = 16:00-06:00 UTC PDT).
    # Content-gated commits: idle cycles make a few API calls and commit nothing, so the
    # loop self-scopes to game windows. While tracked games are live, TD/score/quote
    # changes land within one 5-min cycle.
    - cron: '*/5 16-23,0-6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wooder-td-tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: update TD tracker + futures quote feeds
        run: |
          python3 scripts/wooder_td_feed.py slates/nfl_latest.json slates/nfl_live.json
          python3 scripts/futures_quotes.py futures.json --write || echo "futures_quotes failed - keeping last quotes" >&2
      - name: commit only on content change
        run: |
          git config user.name 'wooder-td-tracker'
          git config user.email 'actions@users.noreply.github.com'
          python3 scripts/fastloop_changed.py slates/nfl_live.json generated_at /tmp/old_live.json /tmp/new_live.json
          python3 scripts/fastloop_changed.py futures.json quoted_at /tmp/old_fut.json /tmp/new_fut.json
          if ! diff -q /tmp/old_live.json /tmp/new_live.json >/dev/null || ! diff -q /tmp/old_fut.json /tmp/new_fut.json >/dev/null; then
            git add slates/nfl_live.json futures.json
            git commit -m "fast loop: td tracker + futures quotes $(date -u +'%H:%M') UTC"
            git pull --rebase origin main && git push
          else
            echo "idle - feeds unchanged"
          fi
