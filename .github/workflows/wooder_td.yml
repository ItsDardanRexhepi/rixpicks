name: wooder-td-tracker
on:
  schedule:
    # 5-min cadence across plausible NFL windows (9 AM - 11 PM PT = 16:00-06:00 UTC PDT).
    # Content-gated commits: idle cycles make a few API calls and commit nothing, so the
    # loop self-scopes to game windows. While tracked games are live, TD/score/quote
    # changes land within one 5-min cycle.
    - cron: '*/5 16-23,0-6 * * *'
  workflow_dispatch:
    inputs:
      hold_bypass:
        description: 'REPAIR ONLY: set to the word repair to override a posting hold (logged loudly with actor)'
        type: string
        default: ''
  # Oct 5: hosted cron starved this workflow (0 schedule fires 14:34-16:53 UTC, futures quotes went
  # stale and tripped the gate). The CF dispatcher's external-tick (every 15 min) is the reliable
  # time base, same as odds-refresh; the */5 cron stays as backstop.
  repository_dispatch:
    types: [external-tick]
permissions:
  contents: write
concurrency:
  group: site-main-writers
  cancel-in-progress: false
jobs:
  hold-check:
    # posting-job auto-hold: structural FAIL only (9/30). Fails open on unknown/error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hc.outputs.held }}
    steps:
      - uses: actions/checkout@v4
      - id: hc
        uses: ./.github/actions/hold-check
  track:
    needs: hold-check
    if: ${{ !cancelled() && needs.hold-check.result == 'success' && needs.hold-check.outputs.held == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate workflow YAML
        run: |
          pip install -q pyyaml
          python3 scripts/check_workflows.py
      - name: update TD tracker + futures quote feeds
        run: |
          python3 scripts/wooder_td_feed.py slates/nfl_latest.json slates/nfl_live.json
          python3 scripts/futures_quotes.py futures.json --write || echo "futures_quotes failed - keeping last quotes" >&2
      - name: commit only on content change
        run: |
          git config user.name 'wooder-td-tracker'
          git config user.email 'actions@users.noreply.github.com'
          python3 scripts/fastloop_changed.py slates/nfl_live.json generated_at /tmp/old_live.json /tmp/new_live.json
          python3 scripts/fastloop_changed.py futures.json quoted_at /tmp/old_fut.json /tmp/new_fut.json
          python3 - <<'PYHB'
          import json,subprocess,datetime
          old=subprocess.run(['git','show','HEAD:futures.json'],capture_output=True,text=True).stdout
          def mx(t):
              try:d=json.loads(t)
              except Exception:return None
              qs=[]
              def walk(o):
                  if isinstance(o,dict):
                      for k,v in o.items():
                          if k=='quoted_at' and isinstance(v,str):qs.append(v)
                          else:walk(v)
                  elif isinstance(o,list):
                      for v in o:walk(v)
              walk(d);return max(qs) if qs else None
          o=mx(old);n=mx(open('futures.json').read())
          # quoted_at is the page's freshness proof (9/27 staleness kill): commit on a >10 min
          # verification heartbeat even when prices are flat, else quiet markets freeze the as-of.
          beat='1' if (o and n and (datetime.datetime.fromisoformat(n)-datetime.datetime.fromisoformat(o)).total_seconds()>600) or (n and not o) else '0'
          open('/tmp/fut_beat','w').write(beat)
          PYHB
          if ! diff -q /tmp/old_live.json /tmp/new_live.json >/dev/null || ! diff -q /tmp/old_fut.json /tmp/new_fut.json >/dev/null || [ "$(cat /tmp/fut_beat 2>/dev/null)" = "1" ]; then
            git add slates/nfl_live.json futures.json
            git commit -m "fast loop: td tracker + futures quotes $(date -u +'%H:%M') UTC"
            # K22 (Sep 30, run 36730127672): hardened push guard - resets HEAD on loud-fail
            # (the on-failure hook pushes HEAD) and fails loud when upstream moved a
            # lane-shipped file mid-run; -X theirs alone silently discarded lane pushes.
            # The guard also reads the push back (origin/main must contain HEAD); a run with
            # nothing to commit has nothing to read back (Oct 2 runs 36962855292 + 36962967323).
            bash scripts/push_with_guard.sh
          else
            echo "idle - feeds unchanged"
          fi
