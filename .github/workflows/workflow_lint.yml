name: workflow-lint
# guard 4 YAML-gate class: the 00:31 instant-fail class (invalid workflow YAML) never reaches
# the default branch unparseable again. Runs on any workflow-file push.
on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/test_hold_wiring.py'
      - 'scripts/push_with_guard.sh'
      - 'scripts/test_push_race_guard.sh'
      - 'scripts/watchdog.py'
      - 'scripts/pages_changed.py'
      - 'scripts/test_pages_changed.py'
      - 'scripts/watchdog_diag.py'
      - 'scripts/test_watchdog_diag.py'
      - 'scripts/futures_window.js'
      - 'scripts/test_futures_window.js'
      - 'scripts/test_workflow_run_names.py'
  workflow_dispatch:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout"
        uses: actions/checkout@v4
      - name: "hold wiring fixture (posting-job auto-hold) + bite proof"
        run: python3 scripts/test_hold_wiring.py --selfbite
      - name: "push guard fixture (real git race, incl. no-commit run)"
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          bash scripts/test_push_race_guard.sh
      - name: "watchdog diagnosis fixture (quotes the failed job)"
        run: python3 scripts/test_watchdog_diag.py
      - name: "futures freshness window fixture"
        run: node scripts/test_futures_window.js
      - name: "pages change-detect fixture"
        run: python3 scripts/test_pages_changed.py
      - name: "workflow_run names resolve + failure hooks watch every site writer"
        run: python3 scripts/test_workflow_run_names.py
      - name: "yaml parse gate + actionlint"
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = False
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  print('INVALID %s: %s' % (f, e)); bad = True
          sys.exit(1 if bad else 0)
          EOF
          if command -v actionlint >/dev/null 2>&1; then actionlint -oneline; else
            curl -sS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s latest ./bin >/dev/null 2>&1 && ./bin/actionlint -oneline || echo 'actionlint unavailable - parse gate already passed'
          fi
