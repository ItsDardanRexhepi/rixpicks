name: x-feed
# X API recent-search feed for the SENSE stage (main 9/27 9:25 PM handoff from analysis).
# Cron live since 9:25 his sign-off (see schedule note).
on:
  repository_dispatch:
    # external time base (guard 4 scheduler class): the Cloudflare gh-dispatcher worker fires
    # every 15 min - GitHub hosted cron starves this repo and is a BACKSTOP signal only.
    # x-feed-chain: fired by the rixpicks-feeds worker on each news rotation (Lane 3 Option A).
    types: [external-tick, x-feed-chain]
  schedule:
    # UNPARKED 15-min: his verbatim sign-off '15-min' (main 9:25), burn math presented (~$3.17/day vs $9.04 free, billing after). Balance-watch: ledger exits 1 under $2.00.
    - cron: '*/15 * * * *'
    # Spend ceiling (Oct 2): the ledger later showed $3.25-$4.45 per cycle, so scripts/x_budget.py now
    # holds the trailing-24h X spend under the repo variable X_DAILY_CAP_USD ($3.00 when unset).
  workflow_run:
    # sync-at-all-times (user 4:27 class kill): the pair map tracks the news feed by CONSTRUCTION -
    # every news-refresh completion re-runs the chain. The freshness guard below exits before any
    # X pull when the map already covers the current news, so burn only happens on real rotation.
    workflows: ["news-refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      hold_bypass:
        description: 'REPAIR ONLY: set to the word repair to override a posting hold (logged loudly with actor)'
        type: string
        default: ''
      verify_only:
        description: 'Only verify the token (GET /2/users/me), no pulls'
        type: boolean
        default: false
      ns_mode:
        description: 'news_social mode: pull (standing) or trial (sentient strategy trials)'
        type: choice
        options: [pull, trial]
        default: pull
permissions:
  contents: write
  actions: write
concurrency:
  group: x-feed
  cancel-in-progress: false
jobs:
  hold-check:
    # posting-job auto-hold: structural FAIL only (9/30). Fails open on unknown/error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hc.outputs.held }}
    steps:
      - uses: actions/checkout@v4
      - id: hc
        uses: ./.github/actions/hold-check
  feed:
    needs: hold-check
    if: ${{ !cancelled() && needs.hold-check.result == 'success' && needs.hold-check.outputs.held == 'false' }}
    runs-on: ubuntu-latest
    # X spend controls, repo variables (Settings > Secrets and variables > Actions > Variables) that
    # the scripts only read: X_DAILY_CAP_USD = daily ceiling for paid X pulls in dollars, $3.00 (the
    # signed-off figure) when unset or unreadable; X_PAID_PULLS=off = no paid X request at all (news
    # bridging, the matcher and the commits keep running).
    env:
      X_DAILY_CAP_USD: ${{ vars.X_DAILY_CAP_USD }}
      X_PAID_PULLS: ${{ vars.X_PAID_PULLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Lane 3 Option A bridge (main 9/30 4:04 PM PT): GH news-refresh is OFF; the worker's news
      # is copied into slates/news.json here so the chain and the page stay generation-matched.
      # It is committed together with the map in the final step (never ahead of it), with an
      # always() safety commit if the chain dies first so news cannot go stale.
      - name: "bridge: worker news -> slates/news.json"
        run: python3 scripts/bridge_worker_news.py
      # X spend gate (Oct 2): X_PAID_PULLS=off skips every paid step. Otherwise spend = the burn
      # ledger's trailing 24h at the code's rates, ceiling = X_DAILY_CAP_USD. The ledger is first
      # synced with main's newest copy: a run queued before the previous run published its ledger
      # would otherwise neither count nor keep that spend. When not even the smallest request fits,
      # every paid step is skipped (SKIP_X_PULL) while news, the matcher and the commits still run;
      # each script also shrinks its own pull to what is left.
      - name: "X spend gate (pause switch, daily cap, ledger synced with main)"
        run: |
          main_ledger=""
          if git fetch -q origin main && git show FETCH_HEAD:slates/x_burn.jsonl > "$RUNNER_TEMP/x_burn_main.jsonl"; then
            main_ledger="$RUNNER_TEMP/x_burn_main.jsonl"
          else
            echo "::warning::main's burn ledger could not be read - spend is counted from this checkout's ledger only"
          fi
          python3 scripts/x_budget.py gate ${main_ledger:+--main-ledger "$main_ledger"}
      # IFTTT rule set (owner 5:24 "Make the social feed algo have an IFTTT protocol"):
      #   R1 IF news rotates (news-refresh completes) THEN chain runs: pull -> match -> publish.
      #   R2 IF a visible story lacks a verified pair THEN the chain keeps pulling per-story posts
      #      and probing new candidates EVERY cycle until verified (owner 5:22 - muted label is a
      #      waypoint, never the destination).
      #   R3 IF the map regenerates THEN the live page upgrades slides/badges within one poll tick
      #      (rtPoll 45s + sig-gated rebuild; no reload).
      #   R4 IF a probe verdict lands THEN it caches salted by every decision-changing input.
      #   R5 IF a pair is found false THEN it is killed in map + verdict cache and the probe class
      #      is hardened (QA 5:21 pub-ad false green -> v4-commercial-gate).
      # Pairing still runs for every news completion. Paid X pulls have a minimum
      # 15-minute gap, measured from the burn ledger's last actual request, not
      # a map timestamp (a regenerated map proves nothing about new X posts).
      - name: "X pull floor (at least 15 minutes between billed requests)"
        run: |
          python3 - <<'EOF'
          import datetime, json, os
          now = datetime.datetime.now(datetime.timezone.utc)
          last = None
          try:
              with open('slates/x_burn.jsonl') as f:
                  for line in f:
                      try:
                          row = json.loads(line)
                          dt = datetime.datetime.fromisoformat(row['ts'].replace('Z', '+00:00'))
                          if dt.tzinfo and (last is None or dt > last): last = dt
                      except (ValueError, KeyError, TypeError): pass
          except FileNotFoundError: pass
          due = not last or now - last >= datetime.timedelta(minutes=15)
          print('X pull due:', due, 'last billed request:', last)
          if not due:
              with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SKIP_X_PULL=1\n')
          EOF
      - name: "x feed pull (burn-ledgered)"
        if: env.SKIP_X_PULL != '1'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          MODE: ${{ inputs.verify_only && 'verify' || 'pull' }}
          X_RUN_OUTCOME: ${{ runner.temp }}/x_run_outcome.jsonl
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "X_BEARER_TOKEN not set - dormant cycle (fill pending)"; exit 0
          fi
          python3 scripts/x_feed.py "$MODE"
      - name: "news-driven social pull (owner 1:11 + 1:15 - X API is the tap; trials route around until a path works)"
        if: env.SKIP_X_PULL != '1' && !inputs.verify_only
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NS_MODE: ${{ inputs.ns_mode || 'pull' }}
          X_RUN_OUTCOME: ${{ runner.temp }}/x_run_outcome.jsonl
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "X_BEARER_TOKEN not set - news_social dormant"; exit 0
          fi
          python3 scripts/news_social.py "$NS_MODE"
      # Sustained-wall alert (Oct 2): the wall skip above ends a run green, so 402 on every request
      # for ~68 h reached no alert. Both pulls record their request outcome; this step counts due runs
      # in a row on which X denied EVERY request (401/402/403) in slates/x_wall_state.json (committed
      # with the feed). At 4 it sets X_WALL_ALERT and the LAST step fails the run, after news and the
      # commits, so incident-hook records it; it repeats every 6 h while the wall lasts, not every run.
      - name: "X wall streak (every request denied on 4 due runs in a row -> alert)"
        if: ${{ !cancelled() && env.SKIP_X_PULL != '1' && !inputs.verify_only }}
        env:
          X_RUN_OUTCOME: ${{ runner.temp }}/x_run_outcome.jsonl
        run: python3 scripts/x_wall.py streak
      # Publish the successful X ingest before embedding/probe work can keep the job
      # busy for minutes. Matcher publishes its map in the later commit step.
      - name: "publish X feed and paid-pull ledger before matcher"
        if: env.SKIP_X_PULL != '1' && !inputs.verify_only
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/x_feed.json slates/x_burn.jsonl slates/x_feed_state.json slates/soc_trials.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "x ingest $(date -u +%H:%M) UTC"
            # same bash -e/conflict class as the commit-feed step (chain 36526891590 died here
            # 05:36Z on a rebase conflict, wasting a billed pull): if-guarded, theirs-wins.
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q; then
                if git push -q; then ok=1; break; fi
              else
                if git status --porcelain | grep -q '^UU slates/'; then
                  git checkout --theirs -- slates/ || true
                  git add slates/ || true
                  if GIT_EDITOR=true git rebase --continue; then
                    if git push -q; then ok=1; break; fi
                  fi
                fi
                git rebase --abort 2>/dev/null || true
              fi
              sleep 5
            done
            [ "$ok" = "1" ] || exit 1
          fi
      # DOM fixture in its own step, still ahead of the matcher so a failure aborts the chain before
      # a map ships: jsdom pinned to the version the chain has been green on (30.1.1), lifecycle
      # scripts skipped, and no secret in this step's environment (the matcher token stays in the
      # match step). Guarded by scripts/test_workflow_npm_pins.py in workflow-lint.
      - name: "zero-pair fallback DOM fixture (jsdom pinned, no secrets in env)"
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --silent jsdom@30.1.1
          node scripts/test_feed_fallback_dom.js  # zero-pair fallback independent-feeds render fixture (jsdom DOM)
      # Post-Option-A flow (main 9/30 5:53 PM PT): GH news-refresh is off, so NOTHING else builds the
      # map. Every run that publishes a new X generation in the step above (15-min external-tick,
      # x-feed-chain from the worker's news rotation, schedule, workflow_run) must also build the
      # map here, so x_feed.json and soc_match.json never sit on different generations.
      # (Was gated to x-feed-chain only: ticks published a new X generation with no map until the
      # next chain run - the guard-5 mismatch window.)
      - name: "semantic match build (URF six-gate, owner 1:00/1:01 - every link passes the full loop)"
        env:
          NIM_CLIENT_TOKEN: ${{ secrets.NIM_CLIENT_TOKEN }}
        run: |
          if [ -z "$NIM_CLIENT_TOKEN" ]; then
            echo "NIM_CLIENT_TOKEN not set - matcher dormant"; exit 0
          fi
          printf '%s' "$NIM_CLIENT_TOKEN" > /tmp/.nim_client_token
          python3 scripts/soc_fixtures.py  # deterministic gate regressions - abort the chain before a bad map ships
          node scripts/test_buildpairs_class.js  # buildPairs match-before-slice class fixture (guard 3, 1:08 9/29)
          node scripts/test_feed_boot_class.js  # first-load coherent settle + rolled-dates class fixture (guard 1, 1:28 9/29)
          node scripts/test_client_spam.js  # client isPublishablePost spam/commercial gate fixture (crypto-spam class, Sep 29)
          python3 scripts/test_mlb_form_fallback.py  # MLB Stats API form fallback fixture (Sep 29)
          python3 scripts/soc_match.py
      - name: "commit feed + burn ledger"
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/news.json slates/x_feed.json slates/x_burn.jsonl slates/x_feed_state.json slates/soc_trials.json slates/soc_match.json slates/soc_vecs.json slates/soc_verdicts.json 2>/dev/null || exit 0
          # own guarded add: a missing wall-state file must never make the add above drop the feed commit
          if [ -f slates/x_wall_state.json ]; then git add slates/x_wall_state.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "x feed $(date -u +%H:%M) UTC"
          # bash -e killed this loop on ANY push race: a failing && list at statement level
          # exits the step before theirs-wins could run (chain 36523387751, 04:51Z). Every
          # fallible command below is an if-condition or ||-guarded so all 5 retries survive.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q; then
              if git push -q; then exit 0; fi
            else
              # generated slates: a content conflict means a sibling chain committed first -
              # this run's freshly computed, self-consistent set always wins (chain 36499444063
              # lost a completed map to this conflict 9/28 23:59). Non-slate conflicts abort+retry.
              if git status --porcelain | grep -q '^UU slates/'; then
                git checkout --theirs -- slates/ || true
                git add slates/ || true
                if GIT_EDITOR=true git rebase --continue; then
                  if git push -q; then exit 0; fi
                fi
              fi
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          exit 1
      # Safety net: if the chain failed before the final commit, still publish the bridged news
      # (stale map is the pre-existing 'hold prior coherent unit' case; stale news is worse).
      - name: "bridge safety commit (news only, if chain did not publish it)"
        if: always()
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/news.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "news bridge $(date -u +%H:%M) UTC"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q; then
              if git push -q; then exit 0; fi
            else
              if git status --porcelain | grep -q '^UU slates/'; then
                git checkout --theirs -- slates/ || true
                git add slates/ || true
                if GIT_EDITOR=true git rebase --continue; then
                  if git push -q; then exit 0; fi
                fi
              fi
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          exit 1
      # Moved from news-refresh (now disabled): kalshi-quotes is still GH-side, keep its watchdog.
      - name: "kalshi-quotes staleness watchdog"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/368490964/runs?per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs',[]); print((r[0]['created_at']+' '+r[0]['status']) if r else '1970-01-01T00:00:00Z none')")
          ts=$(echo "$last" | cut -d' ' -f1); st=$(echo "$last" | cut -d' ' -f2)
          age=$(( $(date +%s) - $(date -d "$ts" +%s) ))
          echo "newest kalshi-quotes run: $ts status=$st age=${age}s"
          if [ "$st" = "queued" ] || [ "$st" = "in_progress" ]; then echo "run active - no dispatch"
          elif [ "$age" -gt 600 ]; then
            echo "stale >10min - dispatching kalshi-quotes"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/368490964/dispatches" \
              -d '{"ref":"main"}'
          else echo "fresh - no dispatch"; fi
      # Sustained-wall alert: the LAST step, so the news bridge, the feed commit and the news safety
      # commit above have all run. It fails the run on purpose (incident-hook captures x-feed failures).
      - name: "X wall alert (fails the run so incident-hook records it; news already published)"
        if: ${{ !cancelled() && env.X_WALL_ALERT == '1' }}
        run: |
          echo "::error title=X API wall::$X_WALL_MSG"
          echo "X WALL ALERT - error, run failed on purpose so incident-hook records it: $X_WALL_MSG"
          exit 1
