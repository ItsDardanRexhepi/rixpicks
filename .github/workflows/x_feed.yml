name: x-feed
# X API recent-search feed for the SENSE stage (main 9/27 9:25 PM handoff from analysis).
# Cron live since 9:25 his sign-off (see schedule note).
on:
  repository_dispatch:
    # external time base (guard 4 scheduler class): the Cloudflare gh-dispatcher worker fires
    # every 15 min - GitHub hosted cron starves this repo and is a BACKSTOP signal only.
    types: [external-tick]
  schedule:
    # UNPARKED 15-min: his verbatim sign-off '15-min' (main 9:25), burn math presented (~$3.17/day vs $9.04 free, billing after). Balance-watch: ledger exits 1 under $2.00.
    - cron: '*/15 * * * *'
  workflow_run:
    # sync-at-all-times (user 4:27 class kill): the pair map tracks the news feed by CONSTRUCTION -
    # every news-refresh completion re-runs the chain. The freshness guard below exits before any
    # X pull when the map already covers the current news, so burn only happens on real rotation.
    workflows: ["news-refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Only verify the token (GET /2/users/me), no pulls'
        type: boolean
        default: false
      ns_mode:
        description: 'news_social mode: pull (standing) or trial (sentient strategy trials)'
        type: choice
        options: [pull, trial]
        default: pull
permissions:
  contents: write
concurrency:
  group: x-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # IFTTT rule set (owner 5:24 "Make the social feed algo have an IFTTT protocol"):
      #   R1 IF news rotates (news-refresh completes) THEN chain runs: pull -> match -> publish.
      #   R2 IF a visible story lacks a verified pair THEN the chain keeps pulling per-story posts
      #      and probing new candidates EVERY cycle until verified (owner 5:22 - muted label is a
      #      waypoint, never the destination).
      #   R3 IF the map regenerates THEN the live page upgrades slides/badges within one poll tick
      #      (rtPoll 45s + sig-gated rebuild; no reload).
      #   R4 IF a probe verdict lands THEN it caches salted by every decision-changing input.
      #   R5 IF a pair is found false THEN it is killed in map + verdict cache and the probe class
      #      is hardened (QA 5:21 pub-ad false green -> v4-commercial-gate).
      # Pairing still runs for every news completion. Paid X pulls have a minimum
      # 15-minute gap, measured from the burn ledger's last actual request, not
      # a map timestamp (a regenerated map proves nothing about new X posts).
      - name: "X pull floor (at least 15 minutes between billed requests)"
        run: |
          python3 - <<'EOF'
          import datetime, json, os
          now = datetime.datetime.now(datetime.timezone.utc)
          last = None
          try:
              with open('slates/x_burn.jsonl') as f:
                  for line in f:
                      try:
                          row = json.loads(line)
                          dt = datetime.datetime.fromisoformat(row['ts'].replace('Z', '+00:00'))
                          if dt.tzinfo and (last is None or dt > last): last = dt
                      except (ValueError, KeyError, TypeError): pass
          except FileNotFoundError: pass
          due = not last or now - last >= datetime.timedelta(minutes=15)
          print('X pull due:', due, 'last billed request:', last)
          if not due:
              with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SKIP_X_PULL=1\n')
          EOF
      - name: "x feed pull (burn-ledgered)"
        if: env.SKIP_X_PULL != '1'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          MODE: ${{ inputs.verify_only && 'verify' || 'pull' }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "X_BEARER_TOKEN not set - dormant cycle (fill pending)"; exit 0
          fi
          python3 scripts/x_feed.py "$MODE"
      - name: "news-driven social pull (owner 1:11 + 1:15 - X API is the tap; trials route around until a path works)"
        if: env.SKIP_X_PULL != '1' && !inputs.verify_only
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NS_MODE: ${{ inputs.ns_mode || 'pull' }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "X_BEARER_TOKEN not set - news_social dormant"; exit 0
          fi
          python3 scripts/news_social.py "$NS_MODE"
      # Publish the successful X ingest before embedding/probe work can keep the job
      # busy for minutes. Matcher publishes its map in the later commit step.
      - name: "publish X feed and paid-pull ledger before matcher"
        if: env.SKIP_X_PULL != '1' && !inputs.verify_only
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/x_feed.json slates/x_burn.jsonl slates/x_feed_state.json slates/soc_trials.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "x ingest $(date -u +%H:%M) UTC"
            # same bash -e/conflict class as the commit-feed step (chain 36526891590 died here
            # 05:36Z on a rebase conflict, wasting a billed pull): if-guarded, theirs-wins.
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q; then
                if git push -q; then ok=1; break; fi
              else
                if git status --porcelain | grep -q '^UU slates/'; then
                  git checkout --theirs -- slates/ || true
                  git add slates/ || true
                  if GIT_EDITOR=true git rebase --continue; then
                    if git push -q; then ok=1; break; fi
                  fi
                fi
                git rebase --abort 2>/dev/null || true
              fi
              sleep 5
            done
            [ "$ok" = "1" ] || exit 1
          fi
      # The dispatcher starts news-refresh and X-feed at the same time.
      # Ingest may publish now; the news-refresh completion builds the coherent map.
      - name: "semantic match build (URF six-gate, owner 1:00/1:01 - every link passes the full loop)"
        if: github.event_name != 'repository_dispatch'
        env:
          NIM_CLIENT_TOKEN: ${{ secrets.NIM_CLIENT_TOKEN }}
        run: |
          if [ -z "$NIM_CLIENT_TOKEN" ]; then
            echo "NIM_CLIENT_TOKEN not set - matcher dormant"; exit 0
          fi
          printf '%s' "$NIM_CLIENT_TOKEN" > /tmp/.nim_client_token
          python3 scripts/soc_fixtures.py  # deterministic gate regressions - abort the chain before a bad map ships
          node scripts/test_buildpairs_class.js  # buildPairs match-before-slice class fixture (guard 3, 1:08 9/29)
          node scripts/test_feed_boot_class.js  # first-load coherent settle + rolled-dates class fixture (guard 1, 1:28 9/29)
          npm install --no-save --silent jsdom && node scripts/test_feed_fallback_dom.js  # zero-pair fallback independent-feeds render fixture (jsdom DOM)
          python3 scripts/test_mlb_form_fallback.py  # MLB Stats API form fallback fixture (Sep 29)
          python3 scripts/soc_match.py
      - name: "commit feed + burn ledger"
        run: |
          git config user.name "RixPicks Bot"
          git config user.email "rixpicks-bot@users.noreply.github.com"
          git add slates/x_feed.json slates/x_burn.jsonl slates/x_feed_state.json slates/soc_trials.json slates/soc_match.json slates/soc_vecs.json slates/soc_verdicts.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "x feed $(date -u +%H:%M) UTC"
          # bash -e killed this loop on ANY push race: a failing && list at statement level
          # exits the step before theirs-wins could run (chain 36523387751, 04:51Z). Every
          # fallible command below is an if-condition or ||-guarded so all 5 retries survive.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q; then
              if git push -q; then exit 0; fi
            else
              # generated slates: a content conflict means a sibling chain committed first -
              # this run's freshly computed, self-consistent set always wins (chain 36499444063
              # lost a completed map to this conflict 9/28 23:59). Non-slate conflicts abort+retry.
              if git status --porcelain | grep -q '^UU slates/'; then
                git checkout --theirs -- slates/ || true
                git add slates/ || true
                if GIT_EDITOR=true git rebase --continue; then
                  if git push -q; then exit 0; fi
                fi
              fi
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          exit 1
