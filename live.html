.play{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.play:first-child{border-top:none}
.play .ph{color:var(--mut);font-size:11px;font-weight:700;margin-right:6px}
.foot{margin-top:16px;font-size:11px;color:var(--mut);text-align:center}
.empty{color:var(--mut);font-size:13px;padding:14px;text-align:center}
.err{color:var(--amber);font-size:13px;padding:14px;text-align:center}
.bits{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.lastplay{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.45}
.torow{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.torow b{color:var(--txt)}
.picklink{display:block;margin-top:14px;border:1px solid var(--acc);border-radius:14px;padding:12px 16px;background:var(--panel);color:var(--acc);text-decoration:none;font-size:13px;font-weight:700;text-align:center}
.rpsc-hd{color:var(--mut)}.rpsc-cell{color:#c8cdd5}.rpsc-tot{color:#c8cdd5}.rpsc-totlast{color:#fff}
.statgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px}
.statgrid:first-child{border:0}
.statgrid span:first-child{text-align:left;font-variant-numeric:tabular-nums}
.statgrid span:nth-child(2){color:var(--mut);text-align:center;padding:0 6px}
.statgrid span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.graph{width:100%;height:116px;display:block}
.small{font-size:11px;color:var(--mut);padding:10px 2px 0}
.shots{margin-top:9px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#122420,#0c1618);padding:10px;position:relative;overflow:hidden}
.shots svg{width:100%;height:auto;display:block}
.shots circle.mk{fill:#3ed6a7;fill-opacity:.85;stroke:#0b1512;stroke-width:.5}
.shots circle.ms{fill:none;stroke:#e0654f;stroke-width:1.1;stroke-opacity:.9}

 var h='<div class="muhead"><div class="muteam">'+logo(away)+'<span class="ab">'+esc(an)+(state==='in'&&possSide(j,comp,away,home)==='away'?'':'')+'</span><span class="nm">'+esc((away.team||{}).displayName||(away.athlete||{}).displayName||"")+'</span></div>'

 if(!sp.length){playsEl.innerHTML='<div class="empty">'+(state==="pre"?"Game has not started.":st.name==="STATUS_CANCELED"?"Game canceled.":"No scoring yet.")+'</div>';}
 else{playsEl.innerHTML=sp.slice().reverse().map(function(p){

function tick(){
 fetch("https://site.api.espn.com/apis/site/v2/sports/"+espn+"/summary?event="+encodeURIComponent(eid)+"&cb="+Date.now(),{cache:"no-store"})
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(j){if(!j||!j.header||!Array.isArray(j.header.competitions)||String((j.header.competitions[0]||{}).id||"")!==eid)throw 0;
   var comp=(j.header.competitions||[])[0]||{};
   var fin=function(s){lastSit=s;lastData=j;lastOk=Date.now();
    var st=(comp.status||{}).type||{};
    if(espn==='baseball/mlb'&&st.state==='in'){rpMlbEnrich(j,function(){render(j);});return;} /* richer statsapi state first, then paint */
    render(j);};
   if(!j.situation||!Object.keys(j.situation).length){ /* summary situation is often an empty object - graft the scoreboard's */
    rpSit(fin);return;}
   fin(j.situation);})
  .catch(function(){if(lastOk){ageEl.textContent='Live feed paused; last update '+Math.round((Date.now()-lastOk)/1000)+'s ago.';if(lastData)render(lastData);}else{scoreEl.innerHTML='<div class="err">Live data unavailable or game ID not found. Check the game link.</div>';fieldEl.innerHTML='<div class="empty">No verified live view.</div>';statsEl.innerHTML='<div class="empty">-</div>';graphEl.innerHTML='<div class="empty">-</div>';playsEl.innerHTML='<div class="empty">-</div>';}});
}
tick();setInterval(tick,2000);
})();</script></body></html>
