</head><body>

  <div class="pick-head">__LOGO__<span class="name">__TEAM__</span><span class="odds">__RECORD__</span></div>

<div class="foot">Stats refresh with each page rebuild; today&rsquo;s score ticks live during the game.</div>
</div>
<script>
const RP_BUILD='__BUILD__';
function rpPTDay(iso){const d=new Date(iso);if(!isFinite(d.getTime()))return '';
 const z=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
 const y=z.find(x=>x.type==='year'),m=z.find(x=>x.type==='month'),day=z.find(x=>x.type==='day');return y&&m&&day?y.value+'-'+m.value+'-'+day.value:'';}
function rpTick(){try{
 const d=document.querySelector('.pick[data-espn]');if(!d||!d.dataset.espn)return;
 const team=(d.dataset.team||'').trim().toLowerCase(),abbr=(d.dataset.abbr||'').trim().toLowerCase();
 const eid=d.dataset.eid||'',day=d.dataset.gameDay||'';
 if(!/^\d+$/.test(eid)||!team||!day||day!==rpPTDay(Date.now()))return;
 fetch('https://site.api.espn.com/apis/site/v2/sports/'+d.dataset.espn+'/scoreboard?dates='+day.replace(/-/g,'')).then(r=>r.json()).then(function(j){
  (j.events||[]).forEach(function(ev){
   const comp=(ev.competitions||[])[0]||{};
   const ed=ev.date||comp.date||'';
   if(!ed||rpPTDay(ed)!==day)return;
   if(eid&&String(ev.id)!==eid)return;
   const participants=comp.competitors||[];
   if(!participants.some(function(c){const x=c.team||{};return String(x.displayName||'').trim().toLowerCase()===team && (!abbr||String(x.abbreviation||'').trim().toLowerCase()===abbr);}))return;
   const st=(comp.status||{}).type||{};
   const comps=comp.competitors||[];
   let sc='';
   // Sep 26 user rule: home team always bottom - away renders first in every score display
   comps.slice().sort(function(a,b){return (a.homeAway==='home'?1:0)-(b.homeAway==='home'?1:0);}).forEach(function(c){sc+=(sc?' - ':'')+((c.team||{}).abbreviation||'')+' '+(c.score!=null?c.score:'\u2014');});  /* batch 4 sweep: unknown != 0 */
   const sline=document.getElementById('rpScore');
   if(sline&&st.state!=='pre'&&sc){sline.textContent=(st.shortDetail||'')+'  |  '+sc;}
  });
 }).catch(function(){});
}catch(e){}}
function rpPageRefresh(){try{
 fetch(location.pathname+'?r='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(function(t){
  if(t.indexOf(RP_BUILD)<0){location.replace(location.pathname+'?v='+Date.now());}
 }).catch(function(){});
}catch(e){}}
rpTick();setInterval(rpTick,60000);setInterval(rpPageRefresh,60000);
</script>
<script data-goatcounter="https://rixpicks.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body></html>
